polka:
  ros__parameters:
    output_frame_id: os_sensor
    output_rate: 15.0
    enable_gpu: true
    source_timeout: 0.5
    timestamp_strategy: earliest
    outputs:
      cloud:
        enabled: true
        topic: ~/merged_cloud
        filters:
          range:
            enabled: false
            min: 0.5
            max: 6.0
          angular:
            enabled: false
            invert: false
            ranges:
            - 315.0
            - 45.0
          box:
            enabled: false
            x_min: -3.0
            x_max: 3.0
            y_min: -3.0
            y_max: 3.0
            z_min: -2.0
            z_max: 2.0
        height_cap:
          enabled: false
          z_min: -0.6
          z_max: 1.0
        self_filter:
          enabled: false
          box_names:
          - chassis
          chassis:
            x_min: -0.6
            x_max: 0.6
            y_min: -0.6
            y_max: 0.6
            z_min: -0.5
            z_max: 0.5
        voxel:
          enabled: false
          leaf_size: 0.0
      scan:
        enabled: true
        topic: ~/merged_scan
        z_min: -1.0
        z_max: 1.5
        angle_min: -3.14159265
        angle_max: 3.14159265
        angle_increment: 0.00436332
        range_min: 0.2
        range_max: 20.0
    source_names:
    - avia
    sources:
      avia:
        topic: /avia/points
        type: pointcloud2
        qos_reliability: reliable
        qos_history_depth: 10
